[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "detguard"
version = "0.1.0"
description = "Policy-as-code enforcement for AI agent tool calls, plus an adversarial regression suite that proves the policy still works after every change."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "ai-agents",
    "guardrails",
    "prompt-injection",
    "security",
    "policy-as-code",
    "tool-calling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]
openai = [
    # The adapter imports `agents`, which ships in openai-agents, NOT in the
    # `openai` client package (which it pulls in transitively). Depending on
    # `openai` alone installs cleanly and then fails at adapter construction —
    # with the ImportError hint that recommends this very extra.
    #
    # The floor is not cosmetic. `set_tool_guard` needs `tool_input_guardrails`
    # on the tool objects, and an SDK without it is skipped by a `hasattr` check
    # (adapters/openai_agents.py) — which silently downgrades a run from
    # `prevented` to `detected` rather than failing. That is the one distinction
    # this project refuses to let blur, so pin above the version that has it.
    "openai-agents>=0.19",
]
dashboard = [
    "streamlit>=1.36",
    "pandas>=2.0",
    "altair>=5.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
detguard = "detguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/detguard"]
# Templates and the default policy ship with the package. This matters:
# the corpus IS the product, and it must be importable from an installed wheel.
artifacts = [
    "src/detguard/templates/*.yaml",
    "src/detguard/policies/*.yaml",
    "src/detguard/policies/*.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/examples",
    "/tests",
    "/docs",
    "/dashboard",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
