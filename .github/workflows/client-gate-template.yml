# detguard client gate — copy this into your own repository.
#
# Two jobs, deliberately different in character:
#
#   pr       blocking. Deterministic layers only, PR subset, fails the build on
#            a new breach. Fast enough that nobody resents it.
#   nightly  non-blocking. Full corpus, llm_judge enabled, uploads artifacts.
#            Slower and probabilistic, which is exactly why it must never gate
#            a merge.
#
# That split is the answer to "regression-testing a nondeterministic system is
# incoherent": the blocking gate runs against deterministic checks and, ideally,
# a scripted agent; the real model runs nightly where a flaky result costs
# somebody a look rather than a blocked release.
#
# Nothing here phones home. Your corpus, your baseline, your results, your repo.
#
# `dashboard/setup.py` can generate a filled-in copy of this file for you —
# see its CI tab — rather than you hand-editing the env block below.

name: detguard

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  DETGUARD_MANIFEST: guardrail/manifest.yaml
  DETGUARD_ROLES: guardrail/roles.yaml
  DETGUARD_POLICY: guardrail/policy.yaml
  DETGUARD_CORPUS: corpus/attacks

  # Pick ONE adapter path and leave the other block's variables empty.
  #
  # generic / openai_agents — a factory you wrote, module:function returning a
  # configured BaseAdapter:
  DETGUARD_ADAPTER: generic
  DETGUARD_AGENT: myapp.detguard_adapter:build_adapter
  #
  # langgraph — no factory needed, detguard builds the adapter from your graph:
  # DETGUARD_ADAPTER: langgraph
  # DETGUARD_GRAPH: myapp.graph:graph
  # DETGUARD_RESET: myapp.db:seed
  # DETGUARD_TOOLS: ""              # only if automatic discovery guesses wrong
  # DETGUARD_STATE_READER: ""       # only if success checks read post-run state

jobs:
  # -------------------------------------------------------------------------
  # Blocking gate on every pull request.
  # -------------------------------------------------------------------------
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install detguard
          pip install -e .

      # Rebuild from templates rather than trusting what is committed: a
      # manifest change that nobody re-instantiated would otherwise leave you
      # testing last month's tool surface.
      - name: Rebuild corpus from the manifest
        run: |
          detguard corpus build \
            --manifest "$DETGUARD_MANIFEST" \
            --roles "$DETGUARD_ROLES" \
            --out "$DETGUARD_CORPUS"

      - name: Run the PR subset
        run: |
          ADAPTER_ARGS=(--adapter "$DETGUARD_ADAPTER")
          if [ "$DETGUARD_ADAPTER" = "langgraph" ] && [ -n "$DETGUARD_GRAPH" ]; then
            ADAPTER_ARGS+=(--graph "$DETGUARD_GRAPH" --reset "$DETGUARD_RESET")
            [ -n "$DETGUARD_TOOLS" ] && ADAPTER_ARGS+=(--tools "$DETGUARD_TOOLS")
            [ -n "$DETGUARD_STATE_READER" ] && ADAPTER_ARGS+=(--state-reader "$DETGUARD_STATE_READER")
          else
            ADAPTER_ARGS+=(--agent "$DETGUARD_AGENT")
          fi
          detguard run \
            --corpus "$DETGUARD_CORPUS" \
            --policy "$DETGUARD_POLICY" \
            "${ADAPTER_ARGS[@]}" \
            --guardrail on \
            --pr-subset \
            --run-dir runs/pr

      - name: Compare against the baseline
        run: |
          detguard baseline compare \
            --results runs/pr/results-on.json \
            --baseline corpus/baseline.json

      - name: Report
        if: always()
        run: |
          detguard report \
            --results runs/pr/results-on.json \
            --baseline corpus/baseline.json \
            --run-dir runs/pr
          cat runs/pr/ci_report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detguard-pr
          path: runs/pr/

  # -------------------------------------------------------------------------
  # Nightly. Full corpus, model-based layer on, never blocking.
  # -------------------------------------------------------------------------
  nightly:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install detguard
          pip install -e .

      - name: Rebuild corpus
        run: |
          detguard corpus build \
            --manifest "$DETGUARD_MANIFEST" \
            --roles "$DETGUARD_ROLES" \
            --out "$DETGUARD_CORPUS"

      # One policy file. The nightly run enables a layer inside it rather than
      # loading a second file — two files drift, and then the gate is testing
      # something you do not actually run.
      - name: Full corpus, guardrail on, llm_judge enabled
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ADAPTER_ARGS=(--adapter "$DETGUARD_ADAPTER")
          if [ "$DETGUARD_ADAPTER" = "langgraph" ] && [ -n "$DETGUARD_GRAPH" ]; then
            ADAPTER_ARGS+=(--graph "$DETGUARD_GRAPH" --reset "$DETGUARD_RESET")
            [ -n "$DETGUARD_TOOLS" ] && ADAPTER_ARGS+=(--tools "$DETGUARD_TOOLS")
            [ -n "$DETGUARD_STATE_READER" ] && ADAPTER_ARGS+=(--state-reader "$DETGUARD_STATE_READER")
          else
            ADAPTER_ARGS+=(--agent "$DETGUARD_AGENT")
          fi
          detguard run \
            --corpus "$DETGUARD_CORPUS" \
            --policy "$DETGUARD_POLICY" \
            "${ADAPTER_ARGS[@]}" \
            --guardrail on \
            --enable-layer llm_judge \
            --audit-log audit.jsonl \
            --run-dir runs/nightly

      - name: Same corpus, guardrail off
        run: |
          ADAPTER_ARGS=(--adapter "$DETGUARD_ADAPTER")
          if [ "$DETGUARD_ADAPTER" = "langgraph" ] && [ -n "$DETGUARD_GRAPH" ]; then
            ADAPTER_ARGS+=(--graph "$DETGUARD_GRAPH" --reset "$DETGUARD_RESET")
            [ -n "$DETGUARD_TOOLS" ] && ADAPTER_ARGS+=(--tools "$DETGUARD_TOOLS")
            [ -n "$DETGUARD_STATE_READER" ] && ADAPTER_ARGS+=(--state-reader "$DETGUARD_STATE_READER")
          else
            ADAPTER_ARGS+=(--agent "$DETGUARD_AGENT")
          fi
          detguard run \
            --corpus "$DETGUARD_CORPUS" \
            --policy "$DETGUARD_POLICY" \
            "${ADAPTER_ARGS[@]}" \
            --guardrail off \
            --run-dir runs/nightly

      - name: Report with the guarded/unguarded delta
        run: |
          detguard report \
            --results runs/nightly/results-on.json \
            --unguarded runs/nightly/results-off.json \
            --baseline corpus/baseline.json \
            --run-dir runs/nightly
          cat runs/nightly/ci_report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detguard-nightly
          path: |
            runs/nightly/
            corpus/attacks/

# After a deliberate policy change, re-record the baseline and commit it:
#
#   detguard run --corpus corpus/attacks --policy guardrail/policy.yaml \
#     --agent "$DETGUARD_AGENT" --guardrail on --run-dir runs/baseline
#   detguard baseline snapshot --results runs/baseline/results-on.json \
#     --out corpus/baseline.json
#
# Reviewing that diff is the point. It is the moment somebody has to look at a
# gap and decide, in writing, that it is acceptable.
